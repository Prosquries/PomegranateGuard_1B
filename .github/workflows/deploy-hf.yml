name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          # Create an orphan branch to wipe history of deleted binaries
          git checkout --orphan deploy-branch
          git add -A
          git commit -m "Deploy clean version"
          # Push the orphan branch to HF's main
          git push --force https://Aarav18032005:$HF_TOKEN@huggingface.co/spaces/Aarav18032005/PomegranateGuard deploy-branch:main
