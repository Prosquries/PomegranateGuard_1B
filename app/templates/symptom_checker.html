<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Checker - PomegranateGuard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <h2>PomegranateGuard</h2>
        <div class="nav-links">
            <!-- Google Translate Widget -->
            <div id="google_translate_element"></div>
            <a href="{{ url_for('dashboard') }}">Scanner</a>
            <a href="{{ url_for('library') }}">Disease Library</a>
            <a href="{{ url_for('logout') }}" class="nav-btn">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="upload-card">
            <h1><i class="fas fa-comment-medical"></i> Symptom Checker</h1>
            <p class="subtitle">Describe the symptoms on your pomegranate fruits, and our AI will attempt to diagnose
                the issue.</p>

            <form method="POST" action="{{ url_for('text_predict') }}" style="margin-top: 20px;">
                <div class="form-group">
                    <textarea name="symptoms" rows="6"
                        placeholder="e.g., I see black sunken spots on the fruit, and it seems to be rotting fast..."
                        required
                        style="width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #ddd; font-family: 'Inter', sans-serif; resize: vertical;"></textarea>
                </div>

                <button type="submit" class="main-btn" style="margin-top: 10px;">
                    Analyze Symptoms
                </button>
            </form>
        </div>
    </div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>

</html>
